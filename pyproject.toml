[project]
name = "testing-agent-ai-worker"
version = "0.1.0"
description = "Testing agent worker for platform-driven API and functional test generation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nanobot-ai",
    "httpx",
    "pydantic",
    "pyyaml",
]

[project.scripts]
testing-agent-ai-demo = "testing_agent_ai_worker.cli.nanobot_demo:main"
testing-agent-ai-chain-demo = "testing_agent_ai_worker.cli.nanobot_chain_demo:main"
testing-agent-ai-worker = "testing_agent_ai_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Includes upstream PR #5056: preserve all length-recovery output segments.
nanobot-ai = { git = "https://github.com/HKUDS/nanobot.git", rev = "b55b76d75574d74c1ff5356bace3b76ad12ef399" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests support direct execution by adding src to sys.path before project imports.
"tests/**/*.py" = ["E402"]

[dependency-groups]
dev = [
    "ruff==0.16.7",
]
